
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: aiops-platform
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/YOUR_USERNAME/ai-mlops-platform.git
    targetRevision: main
    path: deployment/helm/aiops-platform
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: ai-platform
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
