
apiVersion: v1
kind: Namespace
metadata:
  name: ai-platform
  labels:
    app.kubernetes.io/part-of: ai-mlops-platform
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: platform-quota
  namespace: ai-platform
spec:
  hard:
    requests.cpu: "4"
    requests.memory: 8Gi
    limits.cpu: "8"
    limits.memory: 16Gi
    pods: "30"
